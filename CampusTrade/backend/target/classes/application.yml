server:
  port: 8080

spring:
  application:
    name: campus-trade

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # 连接超时：本地没装 Redis 时快速失败并降级为进程内缓存，避免启动卡顿
      connect-timeout: 2000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campustrade.entity

# JWT配置
jwt:
  secret: CampusTradeSecretKey2024ForJWTTokenGenerationMustBe256BitsLong
  expiration: 86400000  # 24小时，单位毫秒

# 文件上传路径
file:
  upload:
    path: ${user.home}/campus-trade/uploads
    max-size: 10485760  # 10MB

# 日志配置
logging:
  level:
    com.campustrade: debug
    org.springframework.security: info
